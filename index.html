<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Stash</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141414;--card2:#1c1c1c;--line:#2a2a2a;--txt:#f2f2f2;--dim:#7a7a7a;--r:28px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 16px 120px;max-width:720px;margin:auto}
button,input,select{font:inherit;color:inherit}
h1{font-size:34px;font-weight:500;letter-spacing:-.5px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
.card{background:linear-gradient(160deg,#1a1a1a,#0e0e0e);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.big{font-size:44px;font-weight:300;letter-spacing:-1px}.big small{font-size:15px;color:var(--dim);margin-left:4px}
.label{font-size:15px}.sub{font-size:13px;color:var(--dim);margin-top:2px}
.ring{width:42px;height:42px;border-radius:50%;border:2px solid #555;border-right-color:var(--txt);display:grid;place-items:center;margin-bottom:28px}
.wide{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
/* activity dots */
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.months span{display:block;text-align:center;font-size:13px;margin-bottom:10px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;justify-items:center}
.dots i{width:4px;height:4px;border-radius:50%;background:#3a3a3a}
.dots i.on{background:#fff;box-shadow:0 0 6px #fff}
/* list */
.search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:12px 18px;margin-bottom:12px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer}
.chip.on{background:var(--txt);color:#000}
.item{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:10px;text-decoration:none;color:inherit}
.fav{width:52px;height:52px;border-radius:16px;background:var(--card2);display:grid;place-items:center;flex:none}
.fav img{width:28px;height:28px}
.vid{display:block;margin-bottom:12px;padding:10px;text-decoration:none;color:inherit}
.vid .thumb{aspect-ratio:16/9;border-radius:20px;background:var(--card2) center/cover;margin-bottom:10px;position:relative;display:grid;place-items:center}
.vid .thumb img{width:40px;height:40px;opacity:.6}
.meta{flex:1;min-width:0}.meta .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.tags b{font-weight:400;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.star{background:none;border:0;font-size:20px;cursor:pointer;color:var(--dim);padding:6px}.star.on{color:#fff}
.empty{color:var(--dim);text-align:center;padding:40px 0}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);width:calc(100% - 32px);max-width:420px;display:flex;justify-content:space-around;padding:10px;border-radius:999px;background:rgba(28,28,28,.8);backdrop-filter:blur(20px);border:1px solid var(--line)}
nav button{background:none;border:0;width:52px;height:44px;border-radius:999px;display:grid;place-items:center;cursor:pointer;opacity:.5}
nav button.on{opacity:1;background:#2c2c2c}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
dialog{margin:auto auto 0;width:100%;max-width:720px;border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;background:#111;color:var(--txt);padding:24px 16px calc(env(safe-area-inset-bottom) + 24px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-weight:500;margin-bottom:16px}
dialog input,dialog select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;outline:none}
.primary{width:100%;padding:15px;border-radius:999px;border:0;background:var(--txt);color:#000;font-weight:500;cursor:pointer;margin-top:6px}
.del{width:100%;padding:12px;background:none;border:0;color:#ff5a5a;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<main id="app"></main>

<nav>
  <button data-page="home" aria-label="Accueil"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="2"/><rect x="14" y="4" width="6" height="6" rx="2"/><rect x="4" y="14" width="6" height="6" rx="2"/><rect x="14" y="14" width="6" height="6" rx="2"/></svg></button>
  <button data-page="links" aria-label="Liens"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
  <button data-page="videos" aria-label="Vidéos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg></button>
  <button data-page="folders" aria-label="Dossiers"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
</nav>

<dialog id="sheet">
  <form method="dialog" id="form">
    <h2 id="sheetTitle">Ajouter</h2>
    <input name="url" type="url" placeholder="https://…" required>
    <input name="title" placeholder="Titre (optionnel)">
    <input name="folder" list="folderList" placeholder="Dossier">
    <datalist id="folderList"></datalist>
    <input name="tags" placeholder="Tags, séparés par des virgules">
    <button class="primary">Enregistrer</button>
    <button type="button" class="del" id="delBtn" hidden>Supprimer</button>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// À remplir : Supabase > Project Settings > API (la clé "anon" est publique, c'est normal)
const SUPABASE_URL = 'https://pmtjifjduepxbaxvrpud.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VD46IzFa38BCmCttMTv_Bw_JE8Z4CP8';
const sb = SUPABASE_URL ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let user = null;
// ponytail: écriture directe, hors-ligne = pas de file d'attente; ajouter une queue si besoin
const push = it => sb && user && sb.from('items').upsert(it).then(({ error }) => error && console.error(error));
const remove = id => sb && user && sb.from('items').delete().eq('id', id).then(({ error }) => error && console.error(error));
async function login(email) {
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  alert(error ? error.message : 'Lien envoyé, ouvre ton email sur cet appareil.');
}
async function pull() {
  const { data, error } = await sb.from('items').select('id,url,title,type,folder,tags,fav,thumb,created').order('created', { ascending: false });
  if (error) return console.error(error);
  // premier login : envoie ce qui existe en local
  const remote = new Set(data.map(i => i.id)), local = items.filter(i => !remote.has(i.id));
  if (local.length) await sb.from('items').upsert(local);
  items = [...local, ...data].sort((a, b) => b.created - a.created); save(); render();
}
const VIDEO_HOSTS = /(youtube\.com|youtu\.be|vimeo\.com|tiktok\.com|dailymotion\.com|twitch\.tv|instagram\.com\/(reel|p)\/)/i;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const host = u => { try { return new URL(u).hostname.replace(/^www\./, '') } catch { return u } };
const favicon = u => `https://www.google.com/s2/favicons?domain=${host(u)}&sz=128`;
const ytId = u => (u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/) || [])[1];

// ponytail: localStorage only, Supabase sync is the next step
let items = [];
try { items = JSON.parse(localStorage.getItem('stash') || '[]') } catch {}
const save = () => { try { localStorage.setItem('stash', JSON.stringify(items)) } catch {} };

let page = 'home', filter = { q: '', folder: null, fav: false, tag: null }, editing = null;

async function addItem({ url, title, folder, tags }) {
  const type = VIDEO_HOSTS.test(url) ? 'video' : 'link';
  const id = ytId(url);
  const it = { id: crypto.randomUUID(), url, title: title || host(url), type, folder: folder || '',
    tags, fav: false, created: Date.now(), thumb: id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : '' };
  items.unshift(it); save(); render(); push(it);
  if (type === 'video') { // titre + miniature pour Vimeo, TikTok, etc.
    try {
      const r = await (await fetch('https://noembed.com/embed?url=' + encodeURIComponent(url))).json();
      if (!title && r.title) it.title = r.title;
      if (!it.thumb && r.thumbnail_url) it.thumb = r.thumbnail_url;
      save(); render(); push(it);
    } catch {}
  }
}

const folders = () => [...new Set(items.map(i => i.folder).filter(Boolean))].sort();
const allTags = list => [...new Set(list.flatMap(i => i.tags))].sort();

function activity() {
  const days = new Set(items.map(i => new Date(i.created).toDateString()));
  const now = new Date();
  return [2, 1, 0].map(back => {
    const m = new Date(now.getFullYear(), now.getMonth() - back, 1);
    const n = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    const dots = Array.from({ length: n }, (_, d) =>
      `<i class="${days.has(new Date(m.getFullYear(), m.getMonth(), d + 1).toDateString()) ? 'on' : ''}"></i>`).join('');
    return `<div><span>${m.toLocaleString('fr', { month: 'short' })}</span><div class="dots">${dots}</div></div>`;
  }).join('');
}

const plusBtn = `<button class="icon-btn" onclick="openSheet()" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>`;

function home() {
  const links = items.filter(i => i.type === 'link').length, vids = items.length - links;
  const week = items.filter(i => Date.now() - i.created < 7 * 864e5).length;
  return `<div class="top"><h1>Stash</h1>${plusBtn}</div>
  <div class="grid2">
    <div class="card" onclick="go('links')"><div class="big">${links}</div><div class="label">Liens</div><div class="sub">sites enregistrés</div></div>
    <div class="card" onclick="go('videos')"><div class="big">${vids}</div><div class="label">Vidéos</div><div class="sub">à regarder</div></div>
  </div>
  <div class="card" style="margin-bottom:12px"><div class="months">${activity()}</div>
    <div class="label">Activité</div><div class="sub">jours où tu as enregistré</div></div>
  <div class="card wide" onclick="go('folders')"><div><div class="label">Dossiers</div><div class="sub">${items.filter(i => i.fav).length} favoris</div></div><div class="big">${folders().length}</div></div>
  <div class="card wide"><div><div class="label">Ajoutés</div><div class="sub">7 derniers jours</div></div><div class="big">${week}</div></div>
  ${!sb ? '' : user
    ? `<p class="sub" style="text-align:center;margin-top:16px">Synchro : ${esc(user.email)} · <a href="#" style="color:inherit" onclick="sb.auth.signOut().then(()=>location.reload())">déconnexion</a></p>`
    : `<form class="card" style="margin-top:12px" onsubmit="event.preventDefault();login(this.email.value)">
        <div class="label">Synchroniser</div><div class="sub" style="margin-bottom:12px">Reçois un lien de connexion par email</div>
        <input class="search" name="email" type="email" placeholder="ton@email.com" required style="margin-bottom:8px">
        <button class="primary">Envoyer le lien</button></form>`}`;
}

function list(type) {
  let list = items.filter(i => i.type === type);
  const tags = allTags(list), q = filter.q.toLowerCase();
  if (filter.fav) list = list.filter(i => i.fav);
  if (filter.tag) list = list.filter(i => i.tags.includes(filter.tag));
  if (filter.folder != null) list = list.filter(i => i.folder === filter.folder);
  if (q) list = list.filter(i => (i.title + i.url + i.tags.join(' ')).toLowerCase().includes(q));
  const chip = (label, on, act) => `<button class="chip ${on ? 'on' : ''}" onclick="${act}">${esc(label)}</button>`;
  const star = i => `<button class="star ${i.fav ? 'on' : ''}" onclick="event.preventDefault();toggleFav('${i.id}')">${i.fav ? '★' : '☆'}</button>`;
  const tagHtml = i => i.tags.length ? `<div class="tags">${i.tags.map(t => `<b>${esc(t)}</b>`).join('')}</div>` : '';
  const sub = i => `${esc(host(i.url))}${i.folder ? ' · ' + esc(i.folder) : ''}`;
  const rows = list.map(i => type === 'link'
    ? `<a class="card item" href="${esc(i.url)}" target="_blank" rel="noopener" oncontextmenu="event.preventDefault();openSheet('${i.id}')">
        <div class="fav"><img src="${favicon(i.url)}" alt="" loading="lazy"></div>
        <div class="meta"><div class="label">${esc(i.title)}</div><div class="sub">${sub(i)}</div>${tagHtml(i)}</div>${star(i)}</a>`
    : `<a class="card vid" href="${esc(i.url)}" target="_blank" rel="noopener" oncontextmenu="event.preventDefault();openSheet('${i.id}')">
        <div class="thumb" style="${i.thumb ? `background-image:url('${esc(i.thumb)}')` : ''}">${i.thumb ? '' : `<img src="${favicon(i.url)}" alt="">`}</div>
        <div class="item" style="padding:0 6px;margin:0"><div class="meta"><div class="label">${esc(i.title)}</div><div class="sub">${sub(i)}</div>${tagHtml(i)}</div>${star(i)}</div></a>`
  ).join('');
  return `<div class="top"><h1>${type === 'link' ? 'Liens' : 'Vidéos'}</h1>${plusBtn}</div>
  <input class="search" placeholder="Rechercher…" value="${esc(filter.q)}" oninput="filter.q=this.value;render();focusSearch()">
  <div class="chips">${chip('★ Favoris', filter.fav, 'filter.fav=!filter.fav;render()')}
    ${filter.folder != null ? chip('📁 ' + (filter.folder || 'Sans dossier') + ' ✕', true, 'filter.folder=null;render()') : ''}
    ${tags.map(t => chip('#' + t, filter.tag === t, `filter.tag=filter.tag===${esc(JSON.stringify(t))}?null:${esc(JSON.stringify(t))};render()`)).join('')}</div>
  ${rows || '<p class="empty">Rien ici pour l’instant</p>'}
  <p class="sub" style="text-align:center;margin-top:10px">Appui long sur un élément pour le modifier</p>`;
}

function foldersPage() {
  const f = [...folders(), ...(items.some(i => !i.folder) ? [''] : [])];
  return `<div class="top"><h1>Dossiers</h1>${plusBtn}</div>
  <div class="grid2">${f.map(name => {
    const n = items.filter(i => i.folder === name);
    return `<div class="card" onclick='openFolder(${esc(JSON.stringify(name))})'>
      <div class="ring">${n.length}</div><div class="label">${esc(name || 'Sans dossier')}</div>
      <div class="sub">${n.filter(i => i.type === 'link').length} liens · ${n.filter(i => i.type === 'video').length} vidéos</div></div>`;
  }).join('')}</div>${f.length ? '' : '<p class="empty">Aucun dossier</p>'}`;
}

function render() {
  $('#app').innerHTML = { home, links: () => list('link'), videos: () => list('video'), folders: foldersPage }[page]();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.page === page));
  $('#folderList').innerHTML = folders().map(f => `<option value="${esc(f)}">`).join('');
}
function focusSearch() { const s = $('.search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length) }
function go(p) { page = p; filter = { q: '', folder: null, fav: false, tag: null }; render(); scrollTo(0, 0) }
function openFolder(name) { const has = t => items.some(i => i.folder === name && i.type === t);
  go(has('link') || !has('video') ? 'links' : 'videos'); filter.folder = name; render() }
function toggleFav(id) { const i = items.find(x => x.id === id); i.fav = !i.fav; save(); render(); push(i) }

function openSheet(id, pre = {}) {
  editing = items.find(i => i.id === id) || null;
  const f = $('#form'), v = editing || pre;
  f.url.value = v.url || ''; f.title.value = editing ? v.title : (v.title || '');
  f.folder.value = v.folder ?? (filter.folder || ''); f.tags.value = (v.tags || []).join(', ');
  $('#sheetTitle').textContent = editing ? 'Modifier' : 'Ajouter';
  $('#delBtn').hidden = !editing;
  $('#sheet').showModal();
}
$('#form').onsubmit = () => {
  const f = $('#form'), data = { url: f.url.value.trim(), title: f.title.value.trim(), folder: f.folder.value.trim(),
    tags: f.tags.value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) };
  if (editing) { Object.assign(editing, data, { title: data.title || host(data.url) }); save(); render(); push(editing) }
  else addItem(data);
};
$('#delBtn').onclick = () => { if (confirm('Supprimer ?')) { remove(editing.id); items = items.filter(i => i !== editing); save(); $('#sheet').close(); render() } };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.page));

// Partage Android : l'URL arrive souvent dans "text"
const p = new URLSearchParams(location.search);
const shared = p.get('url') || (p.get('text') || '').match(/https?:\/\/\S+/)?.[0];
render();
if (shared) { history.replaceState(null, '', location.pathname); openSheet(null, { url: shared, title: p.get('title') || '' }) }
if (sb) {
  sb.auth.onAuthStateChange((_, session) => { const was = user; user = session?.user || null; if (user && !was) pull(); else render() });
  addEventListener('visibilitychange', () => document.visibilityState === 'visible' && user && pull());
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
